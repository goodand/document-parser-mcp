[project]
name = "govparse"
version = "0.1.1"
description = "General-purpose document parsing MCP with HWP/HWPX native structure and PDF conversion, tables and visual evidence"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
    # --- PDF 파싱 (Java 11+ 필요) ---
    "opendataloader-pdf>=0.8",
    "pypdf>=5.1",                  # 페이지수/스캔여부 판별, 분할
    # --- HWPX(XML) 파싱 ---
    "lxml>=5.3",
    # --- HWP(OLE) 구조 검사 ---
    "olefile>=0.47",
    # --- 원본 HWP/HWPX 문단·셀 경계 보존 (PDF와 별도 sidecar) ---
    "rhwp-python==0.8.1",
    # --- 한컴오피스 COM 자동화 (HWP -> HWPX/PDF) ---
    "pywin32>=308; sys_platform == 'win32'",
    # --- 스키마 / 파이프라인 ---
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13.9",
    "tqdm>=4.67",
    "pandas>=2.2",
    "python-slugify>=8.0",
    # --- 총괄표 복구 (opendataloader 가 놓친 표를 되살림) ---
    "pymupdf>=1.28.2",
    # --- MCP 서버 ---
    "mcp[cli]>=1.29.1,<2",
]

[project.optional-dependencies]
# 한컴 COM 변환 실패분 fallback (pyhwp는 설치가 까다로워 분리)
hwp-fallback = ["pyhwp>=0.1b15"]
# 스캔 PDF OCR 보조
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]
# Local Korean table OCR; optional and lazily imported by MCP recovery tool.
table-ocr = ["rapidocr==3.10.0", "onnxruntime==1.31.0"]

[project.scripts]
govparse = "govparse.cli:app"
govparse-mcp = "govparse.mcp_server:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govparse"]

[tool.uv]
# opendataloader-pdf는 JVM 바이너리를 동봉하므로 캐시 재사용 강제
system-certs = true        # 사내망 SSL 검사 대응: Windows 인증서 저장소 사용
compile-bytecode = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
