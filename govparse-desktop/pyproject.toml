[project]
name = "govparse-desktop"
version = "0.1.0"
description = "Cross-platform PySide6 desktop front end for the GovParse engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.1",
    "PyMuPDF==1.28.2",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "mcp==1.30.0",
    "pydantic==2.13.5",
    "olefile==0.47",
    "rhwp-python==0.8.1",
    "lxml==5.3.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-qt==4.4.0", "lxml==5.3.0"]

[tool.uv]
package = false
